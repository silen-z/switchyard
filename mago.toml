#:schema https://mago.carthage.software/1.40.2/schema.json
version = "1"
php-version = "8.4"

[source]
paths = ["src", "tests", "benchmarks", "examples"]
includes = ["vendor"]
excludes = ["var/**", "*/var/**"]

[analyzer]
# Assigning a mixed value is harmless on its own: any later use that needs a real type is still
# reported where it happens (mixed-property-access, mixed-argument, ...), so this only demands
# suppressions at places that already narrow the value before using it.
ignore = ["mixed-assignment"]

[linter]
integrations = ["phpunit"]

[linter.rules]
# Handler::build() enumerates every distinct outcome one request can have — a matched route,
# a HEAD request answered by a GET route's handler, a trailing-slash redirect (itself subject to the
# same HEAD/GET equivalence), method-not-allowed, not-found — each its own real branch of one
# decision, not entangled unrelated responsibilities. Splitting it further would scatter that one
# decision across more entry points rather than simplify it.
cyclomatic-complexity = { threshold = 30, exclude = ["src/Handler.php"] }
kan-defect = { threshold = 2.5 }
halstead = { exclude = ["tests/**", "benchmarks/**"] }

# Data-provider heavy test classes and benchmark classes legitimately have many methods, and so do
# Routes and LazyRoutes, each with one helper per HTTP method, and Handler, whose private helpers
# each name one step of build() (see the cyclomatic-complexity note above).
too-many-methods = { exclude = ["tests/**", "benchmarks/**", "src/Routes.php", "src/LazyRoutes.php", "src/Handler.php"] }

# Each example is one self-contained script, runnable as-is with PHP's built-in server, so its
# handlers and middleware live right next to the routes that use them.
single-class-per-file = { exclude = ["examples/**"] }

no-else-clause = { enabled = false }
